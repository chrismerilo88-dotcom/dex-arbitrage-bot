name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  contracts:
    name: Foundry (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Unit tests
        # DexArbitrageBotFlashLoanUnit.t.sol is the pure suite -- no
        # --fork-url needed (see its own doc comment). BaseSepoliaSmokeTest
        # and DeploySmokeTest require a real, rate-limited RPC endpoint
        # (BASE_SEPOLIA_RPC_URL / MAINNET_RPC_URL) and hit live testnet/
        # mainnet state -- deliberately left out of CI, run manually per
        # their own doc comments instead.
        run: forge test --match-contract DexArbitrageBotFlashLoanUnit -vvv

  off-chain-bot:
    name: off-chain-bot (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: off-chain-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
